name: rubberway
description: Application RubberWay
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  open_file: ^3.3.2
  android_intent_plus: ^5.3.0
  flutter_pdfview: ^1.3.2
  sqflite: ^2.3.0
  path: ^1.9.0
  csv: ^5.0.2

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  image: ^4.5.4
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.4
  signature: ^5.4.0
  path_provider: ^2.1.2
  share_plus: ^10.0.2
  # ⚠️ Versions STABLES et COMPATIBLES
  pdf: ^3.10.7
  printing: ^5.12.0


  # Pour sélectionner des fichiers (optionnel)
file_picker: ^8.1.7



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/rubberway_app_icon.webp"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/rubberway_app_icon.webp"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_sogb.jpg
    - assets/images/fond_questionnaire.jpg
    - assets/images/logo_rubberway.jpg
    - assets/images/fond_dashboard.jpg
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/images/fond_inf.png
